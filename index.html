<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İtiraf Kanalı Durumu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap');

        :root {
            --bg-color: #0a0a0a; 
            --card-bg: #161617;
            --text-main: #f5f5f7;
            --accent-red: #ff453a;
            --accent-gray: #8e8e93;
            --border-color: #2c2c2e;
            --discord-bg: #313338;
            --discord-text: #dbdee1;
            --discord-timestamp: #949ba4;
            --discord-username: #ffffff;
            --discord-note: #b5bac1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 850px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--accent-gray);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .status-card {
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 32px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .no-text {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 800;
            color: var(--accent-red);
            margin: 0;
            line-height: 1;
            letter-spacing: -5px;
            text-shadow: 0 10px 30px rgba(255, 69, 58, 0.2);
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .timer-item {
            background: var(--card-bg);
            padding: 20px 10px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 120px;
        }

        .timer-value {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            font-variant-numeric: tabular-nums; 
        }

        .timer-label {
            display: block;
            font-size: 0.8rem;
            color: var(--accent-gray);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .discord-chat-container {
            background-color: var(--discord-bg);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .discord-message {
            margin-bottom: 16px;
        }

        .discord-message:last-child { margin-bottom: 0; }

        .user-info {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 2px;
            flex-wrap: wrap;
        }

        .username {
            color: var(--discord-username);
            font-weight: 600;
            font-size: 1rem;
        }

        .user-note {
            color: var(--discord-note);
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .timestamp {
            color: var(--discord-timestamp);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .message-text {
            color: var(--discord-text);
            font-size: 1rem;
            line-height: 1.375rem;
        }

        .date-info {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--accent-gray);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AMONG US AGALAR</h1>
        
        <div class="status-card">
            <div style="font-weight: 500; opacity: 0.8; margin-bottom: 15px;">İTİRAF KANALI GERİ GELDİ Mİ?</div>
            <h2 class="no-text">HAYIR</h2>
        </div>

        <div class="timer-grid">
            <div class="timer-item"><span id="days" class="timer-value">-</span><span class="timer-label">Gün</span></div>
            <div class="timer-item"><span id="hours" class="timer-value">-</span><span class="timer-label">Saat</span></div>
            <div class="timer-item"><span id="minutes" class="timer-value">-</span><span class="timer-label">Dakika</span></div>
            <div class="timer-item"><span id="seconds" class="timer-value">-</span><span class="timer-label">Saniye</span></div>
        </div>

        <div class="discord-chat-container">
            <div class="discord-message">
                <div class="user-info">
                    <span class="username">sulfies</span>
                    <span class="user-note">(itiraf açıldı mı? daily)</span>
                    <span class="timestamp">Bugün 23:34</span>
                </div>
                <div class="message-text">kaybımız büyük</div>
            </div>

            <div class="discord-message">
                <div class="user-info">
                    <span class="username">sudmaifa</span>
                    <span class="user-note">(müzik canavarı)</span>
                    <span class="timestamp">Bugün 00:29</span>
                </div>
                <div class="message-text">kapanış anına canlı canlı şahit oldum çok kötüydü</div>
            </div>
        </div>

        <div class="date-info">
            Kanal şu tarihten beri kapalıdır: <strong>08.04.2026 02:37</strong>
        </div>
    </div>

    <script>
        const startDate = new Date("2026-04-08T02:37:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = now - startDate;

            document.getElementById("days").innerText = Math.max(0, Math.floor(distance / (1000 * 60 * 60 * 24)));
            document.getElementById("hours").innerText = Math.max(0, Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
            document.getElementById("minutes").innerText = Math.max(0, Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)));
            document.getElementById("seconds").innerText = Math.max(0, Math.floor((distance % (1000 * 60)) / 1000));
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

</body>
</html>
